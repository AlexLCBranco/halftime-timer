name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check-version
      - run: npm test
      - run: npm run build
      - name: e2e against the build
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:local
